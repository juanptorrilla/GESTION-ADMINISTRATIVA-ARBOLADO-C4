name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Descargar icono institucional de la app inspectores
        run: |
          mkdir -p assets
          curl -fL https://raw.githubusercontent.com/juanptorrilla/RELEVAMIENTO-ARBOLADO---C4/autoria-v7/resources/icon.png -o assets/icon.png
      - name: Preparar archivos web
        run: npm run build
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Generar iconos Android
        run: npx capacitor-assets generate --android
      - name: Instalar funciones nativas
        run: python scripts/install-native-plugin.py
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-administrativa-arbolado-c4-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
